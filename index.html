<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday My Love</title>
  <style>
    body {margin:0;font-family:'Dancing Script',cursive;text-align:center;
      background:linear-gradient(to right,#ffdde1,#ee9ca7);color:#333;overflow:hidden;}
    button {padding:15px 25px;margin:20px;font-size:1.2em;border:none;border-radius:10px;
      background:#ff4081;color:#fff;cursor:pointer;box-shadow:0 0 10px rgba(0,0,0,0.3);}
    .heart {position:fixed;font-size:2em;color:red;animation: float 2s linear forwards;}
    @keyframes float {0%{transform:translateY(0) scale(1);}100%{transform:translateY(-200px) scale(0);}}
    .balloon {position:fixed;bottom:-100px;font-size:3em;animation: rise 8s linear infinite;}
    @keyframes rise {0%{transform:translateY(0);}100%{transform:translateY(-120vh);}}
    .confetti {position:fixed;width:10px;height:10px;background:gold;animation: fall 4s linear forwards;}
    @keyframes fall {0%{transform:translateY(-10px) rotate(0);}100%{transform:translateY(100vh) rotate(360deg);}}
    .firework {position:fixed;width:5px;height:5px;background:yellow;border-radius:50%;
      animation: explode 1s ease-out forwards;}
    @keyframes explode {0%{transform:scale(1);}100%{transform:scale(10);opacity:0;}}
  </style>
  <script>
    document.addEventListener('click',function(e){
      let heart=document.createElement('div');heart.className='heart';
      heart.style.left=e.pageX+'px';heart.style.top=e.pageY+'px';heart.innerHTML='❤️';
      document.body.appendChild(heart);setTimeout(()=>heart.remove(),2000);});
    function createBalloon(){let b=document.createElement('div');b.className='balloon';
      b.style.left=Math.random()*100+'vw';b.innerHTML='🎈';document.body.appendChild(b);
      setTimeout(()=>b.remove(),8000);}setInterval(createBalloon,2000);
    function createConfetti(){let c=document.createElement('div');c.className='confetti';
      c.style.left=Math.random()*100+'vw';c.style.top='0px';
      c.style.background=['red','blue','green','gold','pink'][Math.floor(Math.random()*5)];
      document.body.appendChild(c);setTimeout(()=>c.remove(),4000);}setInterval(createConfetti,300);
    function createFirework(){let f=document.createElement('div');f.className='firework';
      f.style.left=Math.random()*100+'vw';f.style.top=Math.random()*100+'vh';
      document.body.appendChild(f);setTimeout(()=>f.remove(),1000);}setInterval(createFirework,5000);
  </script>
</head>
<body>
  <h1>🎉 Happy Birthday Meri Jaan ❤️ 🎂</h1>
  <p>Welcome to your surprise website!</p>
  <img src="your-photo.jpg" width="250" style="border-radius:15px;box-shadow:0 0 15px #000;">
  <br>
  <button onclick="location.href='letter.html'">💌 Read My Letter</button>
  <button onclick="location.href='gallery.html'">📸 Our Memories</button>
  <button onclick="location.href='music.html'">🎶 Play Our Song</button>
</body>
</html>
<style>
  .sparkle {
    position: fixed;
    width: 5px;
    height: 5px;
    background: gold;
    border-radius: 50%;
    animation: sparkleBlast 1s ease-out forwards;
  }
  @keyframes sparkleBlast {
    0% {transform: scale(1) translate(0,0); opacity:1;}
    100% {transform: scale(0.5) translate(var(--x), var(--y)); opacity:0;}
  }
</style>
<script>
  // Sparkle blast function
  function createSparkles(x,y){
    for(let i=0;i<20;i++){   // 20 sparkles per blast
      let s=document.createElement('div');
      s.className='sparkle';
      s.style.left=x+'px';
      s.style.top=y+'px';
      // random direction
      let dx=(Math.random()-0.5)*200; 
      let dy=(Math.random()-0.5)*200;
      s.style.setProperty('--x',dx+'px');
      s.style.setProperty('--y',dy+'px');
      document.body.appendChild(s);
      setTimeout(()=>s.remove(),1000);
    }
  }

  // Trigger sparkles on click
  document.addEventListener('click',function(e){
    createSparkles(e.pageX,e.pageY);
  });
</script>
