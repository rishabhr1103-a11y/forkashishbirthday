<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>Our Memories</title>
  <!-- वही style + script यहाँ भी paste किया हुआ है -->
</head>
<body>
  <h2>Our Beautiful Memories</h2>
  <img src="photo1.jpg" width="200">
  <img src="photo2.jpg" width="200">
  <img src="photo3.jpg" width="200">
  <br>
  <button onclick="location.href='index.html'">⬅ Back to Home</button>
</body>
</html>
<style>
  body {
    margin:0;
    font-family:'Dancing Script',cursive;
    text-align:center;
    background:linear-gradient(to right,#ffdde1,#ee9ca7);
    color:#333;
    overflow:hidden;
  }
  button {
    padding:15px 25px;
    margin:20px;
    font-size:1.2em;
    border:none;
    border-radius:10px;
    background:#ff4081;
    color:#fff;
    cursor:pointer;
    box-shadow:0 0 10px rgba(0,0,0,0.3);
  }
  .heart {
    position:fixed;
    font-size:2em;
    color:red;
    animation: float 2s linear forwards;
  }
  @keyframes float {
    0% {transform:translateY(0) scale(1);}
    100% {transform:translateY(-200px) scale(0);}
  }
  .balloon {
    position:fixed;
    bottom:-100px;
    font-size:3em;
    animation: rise 8s linear infinite;
  }
  @keyframes rise {
    0% {transform:translateY(0);}
    100% {transform:translateY(-120vh);}
  }
  .confetti {
    position:fixed;
    width:10px;
    height:10px;
    background:gold;
    animation: fall 4s linear forwards;
  }
  @keyframes fall {
    0% {transform:translateY(-10px) rotate(0);}
    100% {transform:translateY(100vh) rotate(360deg);}
  }
  .firework {
    position:fixed;
    width:5px;
    height:5px;
    background:yellow;
    border-radius:50%;
    animation: explode 1s ease-out forwards;
  }
  @keyframes explode {
    0% {transform:scale(1);}
    100% {transform:scale(10);opacity:0;}
  }
</style>
<script>
  // Hearts on touch
  document.addEventListener('click',function(e){
    let heart=document.createElement('div');
    heart.className='heart';
    heart.style.left=e.pageX+'px';
    heart.style.top=e.pageY+'px';
    heart.innerHTML='❤️';
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),2000);
  });

  // Balloons floating
  function createBalloon(){
    let balloon=document.createElement('div');
    balloon.className='balloon';
    balloon.style.left=Math.random()*100+'vw';
    balloon.innerHTML='🎈';
    document.body.appendChild(balloon);
    setTimeout(()=>balloon.remove(),8000);
  }
  setInterval(createBalloon,2000);

  // Confetti falling
  function createConfetti(){
    let confetti=document.createElement('div');
    confetti.className='confetti';
    confetti.style.left=Math.random()*100+'vw';
    confetti.style.top='0px';
    confetti.style.background=['red','blue','green','gold','pink'][Math.floor(Math.random()*5)];
    document.body.appendChild(confetti);
    setTimeout(()=>confetti.remove(),4000);
  }
  setInterval(createConfetti,300);

  // Fireworks burst
  function createFirework(){
    let firework=document.createElement('div');
    firework.className='firework';
    firework.style.left=Math.random()*100+'vw';
    firework.style.top=Math.random()*100+'vh';
    document.body.appendChild(firework);
    setTimeout(()=>firework.remove(),1000);
  }
  setInterval(createFirework,5000);
</script>
<style>
  .sparkle {
    position: fixed;
    width: 6px;
    height: 6px;
    background: red; /* default color */
    border-radius: 50%;
    animation: sparkleBlast 0.8s ease-out forwards; /* fast animation */
  }
  @keyframes sparkleBlast {
    0% {transform: scale(1) translate(0,0); opacity:1;}
    100% {transform: scale(0.5) translate(var(--x), var(--y)); opacity:0;}
  }
</style>
<script>
  // Sparkle bomb function
  function sparkleBomb(x,y){
    for(let i=0;i<40;i++){   // 40 sparkles per bomb
      let s=document.createElement('div');
      s.className='sparkle';
      s.style.left=x+'px';
      s.style.top=y+'px';
      // random direction
      let dx=(Math.random()-0.5)*400; 
      let dy=(Math.random()-0.5)*400;
      s.style.setProperty('--x',dx+'px');
      s.style.setProperty('--y',dy+'px');
      // random red/black color
      s.style.background = Math.random()>0.5 ? 'red' : 'black';
      document.body.appendChild(s);
      setTimeout(()=>s.remove(),800); // fast remove
    }
  }

  // Auto bombs from random positions
  setInterval(()=>{
    let x=Math.random()*window.innerWidth;
    let y=Math.random()*window.innerHeight;
    sparkleBomb(x,y);
  },1200); // हर 1.2 सेकंड में एक bomb
</script>
